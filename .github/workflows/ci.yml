name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip + install RIN with all extras
        run: |
          python -m pip install --upgrade pip
          # Editable install with [all,dev] so ruff, pytest, and every runtime
          # extra is available. We intentionally do NOT install ffmpeg here —
          # tests that need it are skipped or mocked.
          python -m pip install -e ".[all,dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: Pytest (with coverage)
        env:
          # Force Qt to use offscreen / no-window mode so headless CI
          # doesn't fail on missing display.
          QT_QPA_PLATFORM: minimal
        run: |
          pytest -q --cov=rin --cov-report=term-missing --cov-report=xml

      - name: Smoke (boot, then exit)
        env:
          QT_QPA_PLATFORM: minimal
        run: python -m rin --smoke

      - name: Upload coverage XML (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
