[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rin"
version = "0.7.0"
description = "Record It Now — capture, analyze, and search your screen activity"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RIN Contributors" }]
keywords = ["screen-capture", "productivity", "rag", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6>=6.7",
    "pydantic>=2.7",
    "loguru>=0.7",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
storage = [
    "SQLAlchemy>=2.0",
    "chromadb>=0.5",
]
capture = [
    "mss>=9.0",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "pywin32>=306; sys_platform == 'win32'",
]
input = [
    "keyboard>=0.13",
    "pynput>=1.7",
    "hidapi>=0.14",
]
analysis = [
    "APScheduler>=3.10",
    "rapidocr-onnxruntime>=1.3",
    "faster-whisper>=1.0",
    "Pillow>=10.0",
]
rag = [
    "sentence-transformers>=2.7",
]
llm = [
    "openai>=1.30",
    "keyring>=24.0",
]
reports = [
    "Jinja2>=3.1",
    "markdown>=3.6",
]
calendar = [
    "msal>=1.20",
    "requests>=2.30",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
]
telemetry = [
    "sentry-sdk>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]
all = [
    "rin[storage,capture,input,analysis,rag,llm,reports,calendar,telemetry]",
]

[project.scripts]
rin = "rin.__main__:main"

[project.urls]
Homepage = "https://github.com/dengyanbo/RecordItNow"

[tool.hatch.build.targets.wheel]
packages = ["src/rin"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rin",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/rin"]
omit = [
    # Qt main loop + thread-pool plumbing is exercised only end-to-end.
    "src/rin/__main__.py",
    "src/rin/app.py",
    "src/rin/ui/tray.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
